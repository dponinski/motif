[package]
name = "motif"
version = "0.1.0"
description = "Motif — Design Systems Canvas"
authors = ["Motif"]
edition = "2021"

[lib]
name = "motif_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "motif"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
